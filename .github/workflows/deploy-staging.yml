name: Deploy staging

# Builds the staging variant (base path /lgtc-summit-microsite, noindex) and
# deploys it to the Cloudflare Worker `lgtc-summit-microsite-staging` defined in
# wrangler.jsonc.
#
# Runs on every push to main (docs-only changes skipped) and on manual dispatch.
# The route go.summitestate.com/lgtc-summit-microsite* is attached in
# wrangler.jsonc, so a push to main updates that live production path.
# The build and accessibility checks run first; if they fail, nothing deploys.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit;
# Workers Routes: Edit on summitestate.com) and CLOUDFLARE_ACCOUNT_ID if the
# token can see more than one account (account_id is also set in wrangler.jsonc).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:staging
      - run: npx playwright install --with-deps chromium
      - name: Accessibility and heading checks
        env:
          NEXT_PUBLIC_BASE_PATH: /lgtc-summit-microsite
        run: node scripts/a11y-check.mjs
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          npx wrangler deploy
